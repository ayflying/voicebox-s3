<main class="page"><section class="phone"><header class="statusbar"><a href="home-screen.html" class="back">‹</a><time id="clock">10:24</time><div class="status"><span class="wifi-icon"><i></i><b></b><em></em><strong></strong></span><span class="battery-icon"><i></i></span><span>78%</span></div></header><section class="content"><h1>系统设置</h1><div class="list"><button class="row" id="wifiRow"><span class="row-icon blue">⌁</span><span class="row-main"><b>WiFi 网络</b><small id="wifiState">未连接</small></span><span class="chevron">›</span></button><button class="row"><span class="row-icon violet">⌁</span><span class="row-main"><b>网关配置</b><small>100.66.1.5:18080</small></span><span class="chevron">›</span></button><button class="row"><span class="row-icon amber">↑</span><span class="row-main"><b>软件更新</b><small>当前已是最新版本</small></span><span class="chevron">›</span></button><button class="row"><span class="row-icon coral">i</span><span class="row-main"><b>设备信息</b><small>VoiceBox S3</small></span><span class="chevron">›</span></button></div></section></section><aside class="panel"><p class="eyebrow">SYSTEM SETTINGS</p><h2>系统设置</h2><p>用于确认设置页列表密度与入口样式。点击“WiFi 网络”可切换未连接与已连接展示，左上角可返回主页。</p></aside></main><style>:root{--ink:#172033;--muted:#6e7788;--line:#e9edf4;--surface:#fff;--canvas:#f7f8fc;--blue:#3d7cff;--violet:#7453e9;--coral:#f36d67;--amber:#efaa44}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:64px;padding:44px 28px}.phone{width:432px;height:576px;display:flex;flex-direction:column;overflow:hidden;padding:8px 20px 20px;border:1px solid #e3e7f0;border-radius:38px;background:var(--surface);box-shadow:0 24px 60px rgba(24,39,75,.13)}.statusbar{height:22px;display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:700}.back{width:18px;color:#526078;text-decoration:none;font-size:28px;line-height:14px}.status{display:flex;align-items:center;gap:8px;color:#59657a}.wifi-icon{position:relative;width:18px;height:15px;display:block;color:var(--blue);overflow:hidden}.wifi-icon i,.wifi-icon b,.wifi-icon em{position:absolute;left:50%;border:1.7px solid currentColor;border-bottom:0;border-radius:50% 50% 0 0;transform:translateX(-50%)}.wifi-icon i{top:0;width:18px;height:10px}.wifi-icon b{top:3px;width:12px;height:7px}.wifi-icon em{top:6px;width:6px;height:4px}.wifi-icon strong{position:absolute;bottom:0;left:50%;width:3px;height:3px;border-radius:50%;background:currentColor;transform:translateX(-50%)}.battery-icon{position:relative;width:20px;height:10px;padding:1px;border:1.5px solid #59657a;border-radius:3px}.battery-icon:after{content:"";position:absolute;top:2px;right:-4px;width:2px;height:4px;background:#59657a}.battery-icon i{display:block;width:78%;height:100%;background:var(--blue)}.content{padding-top:32px}.content h1{font-size:21px;margin:0 0 22px}.list{border-top:1px solid var(--line)}.row{width:100%;height:74px;display:flex;align-items:center;gap:13px;padding:0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font:inherit;cursor:pointer}.row:active{background:#f7f9fd}.row-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:#fff;font-weight:700;font-size:18px}.blue{background:var(--blue)}.violet{background:var(--violet)}.amber{background:var(--amber)}.coral{background:var(--coral)}.row-main{display:flex;flex:1;min-width:0;flex-direction:column;gap:5px}.row-main b{font-size:13px}.row-main small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8b95a5;font-size:10px}.chevron{color:#a4adbb;font-size:22px}.panel{width:min(360px,100%)}.eyebrow{margin:0 0 10px;color:var(--blue);font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.1em}.panel h2{margin:0 0 14px;font-size:28px}.panel p:not(.eyebrow){margin:0;color:var(--muted);line-height:1.7;font-size:14px}@media(max-width:760px){.page{align-items:flex-start;flex-direction:column;gap:30px;padding:28px 20px}.phone{width:300px;height:400px;padding:6px 14px 14px}.content{padding-top:22px}.content h1{margin-bottom:14px}.row{height:58px}.row-icon{width:28px;height:28px}.panel{width:100%}}</style><script>const clock=document.querySelector('#clock');const tick=()=>clock.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});tick();setInterval(tick,3e4);let online=false;document.querySelector('#wifiRow').onclick=()=>{online=!online;document.querySelector('#wifiState').textContent=online?'已连接：VoiceBox-5G':'未连接'};</script>

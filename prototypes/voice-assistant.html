%;width:3px;height:3px;border-radius:50%;background:currentColor;transform:translateX(-50%)}.battery-icon{position:relative;width:20px;height:10px;padding:1px;border:1.5px solid #59657a;border-radius:3px}.battery-icon:after{content:"";position:absolute;top:2px;right:-4px;width:2px;height:4px;background:#59657a}.battery-icon i{display:block;width:78%;height:100%;background:var(--blue)}.content{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:84px;text-align:center}.orb{width:92px;height:92px;display:grid;place-items:center;border-radius:50%;background:#eaf1ff;color:var(--blue);font-size:40px;box-shadow:0 0 0 12px #f6f8ff}.hint{margin:30px 0 12px;font-size:15px;font-weight:700}.transcript{min-height:58px;width:100%;padding:13px 16px;border-radius:14px;background:#f7f9fd;color:#59657a;font-size:12px;line-height:1.6}.record{margin-top:auto;width:88px;height:88px;border:0;border-radius:50%;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 10px 22px rgba(61,124,255,.3);font:inherit;cursor:pointer}.record:active{transform:scale(.95)}.record span{font-size:22px}.record b{font-size:11px}.subhint{color:#9ca6b5;font-size:10px;margin:14px 0 0}.panel{width:min(360px,100%)}.eyebrow{margin:0 0 10px;color:var(--blue);font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.1em}.panel h2{margin:0 0 14px;font-size:28px}.panel p:not(.eyebrow){margin:0;color:var(--muted);line-height:1.7;font-size:14px}@media(max-width:760px){.page{align-items:flex-start;flex-direction:column;gap:30px;padding:28px 20px}.phone{width:300px;height:400px;padding:6px 14px 14px}.content{padding-top:42px}.orb{width:62px;height:62px;font-size:28px}.hint{margin:20px 0 10px}.record{width:68px;height:68px}.panel{width:100%}}</style><script>const clock=document.querySelector('#clock');const tick=()=>clock.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});tick();setInterval(tick,3e4);const r=document.querySelector('#record'),h=document.querySelector('#hint'),t=document.querySelector('#transcript');r.addEventListener('pointerdown',()=>{h.textContent='正在聆听…';t.textContent='请开始说话';r.querySelector('b').textContent='松开结束'});r.addEventListener('pointerup',()=>{h.textContent='正在识别…';t.textContent='正在将语音转换为文字';r.querySelector('b').textContent='按住说话';setTimeout(()=>{h.textContent='识别完成';t.textContent='“你好，我可以帮你做什么？”'},650)});</script>

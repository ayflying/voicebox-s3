<main class="page">
  <section class="phone" aria-label="VoiceBox S3 主界面原型">
    <header class="statusbar">
      <time id="clock">10:24</time>
      <div class="status" aria-label="设备状态">
        <button class="status-button" id="wifiButton" type="button" title="切换 WiFi 状态" aria-label="WiFi 未连接"><span class="wifi-icon" id="wifiIcon"><i></i><b></b><em></em><strong></strong></span></button>
        <button class="status-button power-button" id="powerButton" type="button" title="切换电源状态" aria-label="使用电池供电"><span class="power-icon" id="powerIcon"></span></button>
        <span class="battery-wrap" aria-label="当前电量"><span class="battery-icon"><i id="batteryFill"></i></span><span id="batteryText">78%</span></span>
      </div>
    </header>

    <div class="home-scroll">
      <section class="app-grid" id="appGrid" aria-label="应用列表"></section>
      <footer>向上滑动查看更多应用</footer>
    </div>
  </section>

  <aside class="panel">
    <p class="eyebrow">INTERACTIVE PROTOTYPE</p>
    <h2>手机式九宫格主页</h2>
    <p>先在这里确认图标、颜色、间距和文字层级，确认后再同步到 ESP32。</p>
    <div class="controls">
      <label>图标尺寸 <input id="iconSize" type="range" min="44" max="68" value="54"><output id="iconSizeOut">54 px</output></label>
      <label>图标间距 <input id="gapSize" type="range" min="12" max="28" value="20"><output id="gapSizeOut">20 px</output></label>
    </div>
    <div class="legend"><span><i class="dot blue"></i>常用功能</span><span><i class="dot violet"></i>设备控制</span><span><i class="dot coral"></i>设置</span></div>
    <p class="status-note">状态栏说明：左侧是时间；右侧依次为 WiFi 信号、水波图标颜色表示联网状态、插头表示外接电源/充电状态，以及电池电量百分比。</p>
  </aside>
</main>

<style>
  :root { --ink:#172033; --muted:#6e7788; --line:#e9edf4; --surface:#ffffff; --canvas:#f7f8fc; --blue:#3d7cff; --violet:#7453e9; --coral:#f36d67; --teal:#2fa99d; --amber:#efaa44; }
  * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:var(--canvas); color:var(--ink); font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
  .page { min-height:100vh; display:flex; align-items:center; justify-content:center; gap:64px; padding:44px 28px; }
  /* 按设备逻辑分辨率 240×320 等比绘制，再放大展示，避免图标与间距失真。 */
  .phone { width:432px; height:576px; display:flex; flex-direction:column; overflow:hidden; padding:32px 36px 40px; border:1px solid #e3e7f0; border-radius:38px; background:var(--surface); box-shadow:0 24px 60px rgba(24,39,75,.13); }
  .statusbar { position:relative; z-index:1; flex:0 0 34px; height:34px; display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:700; letter-spacing:.02em; border-bottom:1px solid var(--line); background:var(--surface); }
  .home-scroll { flex:1; min-height:0; overflow-y:auto; scrollbar-width:none; }.home-scroll::-webkit-scrollbar { display:none; }
  #clock { font-variant-numeric:tabular-nums; font-size:16px; letter-spacing:.01em; color:#1d2940; }
  .status { display:flex; align-items:center; gap:10px; color:#59657a; }
  .status-button { display:flex; align-items:center; gap:4px; padding:3px 0; border:0; background:transparent; color:inherit; font:inherit; font-size:10px; cursor:pointer; }
  /* 标准 WiFi 水波图标：三道同心弧 + 中心信号点。 */
  .wifi-icon { position:relative; width:18px; height:15px; display:block; color:#9aa5b7; overflow:hidden; }
  .wifi-icon i,.wifi-icon b,.wifi-icon em { position:absolute; left:50%; border:1.7px solid currentColor; border-bottom:0; border-radius:50% 50% 0 0; transform:translateX(-50%); font-style:normal; }
  .wifi-icon i { top:0; width:18px; height:10px; }.wifi-icon b { top:3px; width:12px; height:7px; }.wifi-icon em { top:6px; width:6px; height:4px; }.wifi-icon strong { position:absolute; bottom:0; left:50%; width:3px; height:3px; border-radius:50%; background:currentColor; transform:translateX(-50%); }
  .status-button.is-online .wifi-icon { color:var(--blue); }
  /* 电源图标：插头表示外接电源；闪电表示正在充电；无插头表示电池供电。 */
  .power-button { width:16px; height:18px; justify-content:center; }.power-icon { position:relative; width:10px; height:12px; border:1.5px solid #9aa5b7; border-top:0; border-radius:0 0 3px 3px; }.power-icon::before { content:""; position:absolute; top:-4px; left:1px; width:2px; height:4px; border-radius:1px; background:#9aa5b7; box-shadow:5px 0 #9aa5b7; }.power-icon::after { content:""; position:absolute; left:3px; top:3px; width:3px; height:5px; background:#9aa5b7; clip-path:polygon(55% 0,100% 0,58% 44%,88% 44%,0 100%,35% 56%,8% 56%); }.status-button.is-charging .power-icon { border-color:var(--amber); }.status-button.is-charging .power-icon::before,.status-button.is-charging .power-icon::after { background:var(--amber); box-shadow:5px 0 var(--amber); }
  .battery-wrap { display:flex; align-items:center; gap:4px; color:#455168; font-size:10px; font-variant-numeric:tabular-nums; }
  .battery-icon { position:relative; width:20px; height:10px; padding:1px; border:1.5px solid #59657a; border-radius:3px; }.battery-icon::after { content:""; position:absolute; top:2px; right:-4px; width:2px; height:4px; border-radius:0 2px 2px 0; background:#59657a; }.battery-icon i { display:block; width:78%; height:100%; border-radius:1px; background:#3d7cff; transition:width .2s ease,background .2s ease; }
  .app-grid { --icon-size:54px; --grid-gap:20px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:92px; column-gap:var(--grid-gap); row-gap:22px; padding-top:28px; }
  .app { height:92px; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:9px; border:0; background:transparent; color:var(--ink); font:inherit; padding:0; cursor:pointer; }
  .app:active .icon { transform:scale(.92); } .icon { width:var(--icon-size); aspect-ratio:1 / 1; height:auto; flex:0 0 auto; border-radius:18px; display:grid; place-items:center; color:white; font-size:27px; font-family:Arial,sans-serif; font-weight:600; box-shadow:0 6px 14px rgba(30,48,90,.13); transition:transform .15s ease; }
  .app-name { font-size:11px; line-height:1.2; white-space:nowrap; color:#38445a; }
  footer { padding-top:28px; text-align:center; color:#a3abba; font-size:10px; }
  .panel { width:min(360px,100%); } .eyebrow { margin:0 0 10px; color:var(--blue); font:700 11px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.1em; } .panel h2 { margin:0 0 14px; font-size:28px; letter-spacing:-.04em; }.panel>p:not(.eyebrow) { margin:0; color:var(--muted); line-height:1.7; font-size:14px; }
  .controls { margin-top:28px; padding:18px; border:1px solid var(--line); border-radius:16px; background:#fff; }.controls label { display:grid; grid-template-columns:80px 1fr 48px; align-items:center; gap:10px; margin:11px 0; color:#536077; font-size:12px; }.controls input { accent-color:var(--blue); }.controls output { color:#1d2940; font-variant-numeric:tabular-nums; }
  .legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:17px; color:var(--muted); font-size:11px; }.dot { width:8px; height:8px; display:inline-block; border-radius:50%; margin-right:5px; }.blue{background:var(--blue)}.violet{background:var(--violet)}.coral{background:var(--coral)}.status-note{margin-top:20px;color:var(--muted);font-size:11px;line-height:1.7;}
  @media(max-width:760px){ .page{align-items:flex-start; flex-direction:column; gap:30px; padding:28px 20px;}.phone{width:300px;height:400px;padding:22px 25px 28px;align-self:center}.panel{width:100%;} }
</style>

<script>
  const apps = [
    ['语音助手', '♬', '#3d7cff'], ['系统设置', '⚙', '#f36d67'], ['网络连接', '⌁', '#2fa99d'],
    ['设备信息', 'i', '#7453e9'], ['软件更新', '↥', '#efaa44'], ['音量控制', '♪', '#3d7cff'],
    ['录音管理', '●', '#7453e9'], ['使用帮助', '?', '#2fa99d'], ['关于设备', '⌘', '#f36d67'],
    ['更多功能', '＋', '#6e7788'], ['测试入口', '✓', '#3d7cff'], ['开发工具', '‹›', '#7453e9']
  ];
  const grid = document.querySelector('#appGrid');
  apps.forEach(([name, symbol, color]) => {
    const item = document.createElement('button'); item.className='app'; item.setAttribute('aria-label',name);
    item.innerHTML = `<span class="icon" style="background:${color}">${symbol}</span><span class="app-name">${name}</span>`;
    item.onclick = () => item.querySelector('.icon').animate([{transform:'scale(1)'},{transform:'scale(.9)'},{transform:'scale(1)'}],{duration:180});
    grid.append(item);
  });
  const bind = (input, output, variable, suffix=' px') => { const update=()=>{ grid.style.setProperty(variable, input.value+suffix); output.textContent=input.value+suffix; }; input.addEventListener('input',update); update(); };
  bind(document.querySelector('#iconSize'),document.querySelector('#iconSizeOut'),'--icon-size');
  bind(document.querySelector('#gapSize'),document.querySelector('#gapSizeOut'),'--grid-gap');

  const clock = document.querySelector('#clock');
  const updateClock = () => { const now = new Date(); clock.textContent = now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}); };
  updateClock(); setInterval(updateClock, 30000);

  const wifiButton = document.querySelector('#wifiButton');
  let online = false;
  wifiButton.onclick = () => { online = !online; wifiButton.classList.toggle('is-online', online); wifiButton.setAttribute('aria-label', online ? 'WiFi 已连接' : 'WiFi 未连接'); };

  const powerButton = document.querySelector('#powerButton');
  let charging = false;
  powerButton.onclick = () => { charging = !charging; powerButton.classList.toggle('is-charging', charging); powerButton.setAttribute('aria-label', charging ? '外接电源充电中' : '使用电池供电'); };
</script>

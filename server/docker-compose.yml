# ESP32 语音对讲 —— 服务端编排
# 两容器：
#   gateway : GoFrame 鉴权网关，暴露 18080（设备 + 管理员接口都在这里）
#   asr     : Faster-Whisper 纯 CPU 转写，【不映射主机端口】，仅网关内网可达
#
# 固件(OTA) 经 gateway 的 /api/ota/* 分发，落地在命名卷 ota_storage，容器重建不丢。
#
# 镜像：由 GitHub Container Registry（GHCR）提供。
# 启动：在部署服务器进入本目录后执行：
#   AUTH_TOKEN=设备令牌 ADMIN_TOKEN=管理员令牌 docker compose pull && docker compose up -d
# 端口/令牌也可写入同目录 .env 文件。公开镜像无需 docker login。

services:
  gateway:
    # 已发布的网关镜像：由 GHCR 拉取，不在部署机本地构建。
    image: ghcr.io/ayflying/voicebox-s3:latest
    pull_policy: always
    ports:
      - "18080:18080"
    environment:
      - GATEWAY_PORT=18080
      - AUTH_TOKEN=${AUTH_TOKEN:-changeme-device-token}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-changeme-admin-token}
      # Wyoming 协议的 Faster-Whisper 内网地址。
      - UPSTREAM_ASR=asr:10300
      - FIRMWARE_DIR=/firmware
    volumes:
      - ota_storage:/firmware
    depends_on:
      - asr
    restart: unless-stopped

  asr:
    # LinuxServer Faster-Whisper：固定已验证 digest，不使用 latest，避免无谓重拉。
    # 服务使用 Wyoming TCP 协议，仅在 Compose 内网开放 10300。
    image: lscr.io/linuxserver/faster-whisper@sha256:9c0d993fd31a3db8ef83002a114cec9e43c6348dc7098770540444ff0cc562b1
    pull_policy: missing
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
      - WHISPER_MODEL=${WHISPER_MODEL:-base-int8}
      - WHISPER_LANG=zh
      - WHISPER_BEAM=1
    volumes:
      # 模型与运行配置持久化，重建容器不会重复下载。
      - whisper_models:/config
    # 注意：此处【不写 ports】，Whisper 只对同 Compose 网络的 gateway 暴露 10300。
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

volumes:
  ota_storage:
  whisper_models:
